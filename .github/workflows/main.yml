name: RMT Windows Build

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: windows-latest

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup .NET
uses: actions/setup-dotnet@v4
with:
dotnet-version: 8.0.x

- name: Build RMT
run: dotnet publish RMTNative.csproj -c Release -r win-x64 --self-contained true

- name: Upload EXE
uses: actions/upload-artifact@v4
with:
name: RMT-Windows
path: bin/Release/net8.0/win-x64/publish/
